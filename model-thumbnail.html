<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Thumbnail</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #dde7f3;
      }
      #stage {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import * as THREE from './src/vendor/three.module.js';
      import { GLTFLoader } from './src/vendor/GLTFLoader.js';

      const models = {
        bench: ['./src/assets/models/optics/bench.glb', '光具座与刻度尺'],
        source: ['./src/assets/models/optics/source-parallel.glb', '平行光源'],
        object: ['./src/assets/models/optics/object-screen.glb', '物屏'],
        convex: ['./src/assets/models/optics/lens-convex.glb', '双凸透镜'],
        concave: ['./src/assets/models/optics/lens-concave.glb', '凹透镜'],
        cylinder: ['./src/assets/models/optics/lens-cylinder.glb', '柱面镜'],
        support: ['./src/assets/models/optics/correction-support.glb', '矫正镜片支架'],
        eyeD: ['./src/assets/models/optics/sim-eye-d.glb', 'D 正视模拟眼'],
        eyeG: ['./src/assets/models/optics/sim-eye-g.glb', '远视型模拟眼'],
        screen: ['./src/assets/models/optics/image-screen.glb', '像屏']
      };

      const params = new URLSearchParams(location.search);
      const key = params.get('model') || 'convex';
      const [url] = models[key] || models.convex;

      const mount = document.getElementById('stage');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xdde7f3);

      const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 200);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      mount.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1.8));
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
      keyLight.position.set(5, 7, 6);
      scene.add(keyLight);
      const fill = new THREE.HemisphereLight(0xffffff, 0xdfe8ff, 1.2);
      scene.add(fill);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(24, 24),
        new THREE.MeshStandardMaterial({ color: 0xb8c9dc, roughness: 0.72 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -1.4;
      floor.receiveShadow = true;
      scene.add(floor);

      function frameObject(root) {
        const box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        root.position.sub(center);
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const scale = key === 'bench' ? 6.2 / maxDim : 3.75 / maxDim;
        root.scale.multiplyScalar(scale);
        root.rotation.y = key === 'bench' ? -0.55 : -0.82;
        root.rotation.x = key === 'bench' ? 0.05 : 0.12;

        const finalBox = new THREE.Box3().setFromObject(root);
        const finalSize = finalBox.getSize(new THREE.Vector3());
        const dist = Math.max(finalSize.x, finalSize.y, finalSize.z) * (key === 'bench' ? 1.28 : 1.48);
        camera.position.set(dist * 0.72, dist * 0.45, dist);
        camera.lookAt(0, 0, 0);
      }

      new GLTFLoader().load(url, (gltf) => {
        const root = gltf.scene;
        root.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              child.material = child.material.clone();
              if (key === 'concave') {
                child.material.color?.set?.(0x8f6bff);
                child.material.opacity = child.material.transparent ? 0.72 : child.material.opacity;
                child.material.emissive?.set?.(0x2e165f);
                child.material.emissiveIntensity = 0.08;
              }
              if (key === 'convex') {
                child.material.color?.set?.(0x56d7ff);
                child.material.opacity = child.material.transparent ? 0.68 : child.material.opacity;
                child.material.emissive?.set?.(0x0c5e75);
                child.material.emissiveIntensity = 0.06;
              }
              if (key === 'cylinder') {
                child.material.color?.set?.(0x28b58f);
                child.material.opacity = child.material.transparent ? 0.74 : child.material.opacity;
                child.material.emissive?.set?.(0x0a5a44);
                child.material.emissiveIntensity = 0.08;
              }
            }
            if (child.material?.transparent) child.material.depthWrite = child.material.opacity > 0.55;
          }
        });
        scene.add(root);
        frameObject(root);
        renderer.render(scene, camera);
        document.body.dataset.ready = 'true';
      });

      function animate() {
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
</html>
